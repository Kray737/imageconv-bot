services:
  - type: worker
    name: imageconv-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: python bot.py
    repo: https://github.com/Kray737/imageconv-bot
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false

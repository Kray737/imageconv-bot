services:
  - type: web
    name: imageconv-bot
    runtime: python
    plan: free
    region: oregon
    buildCommand: pip install --prefer-binary -r requirements.txt
    startCommand: python entrypoint.py
    healthCheckPath: /health
    repo: https://github.com/Kray737/imageconv-bot
    branch: main
    autoDeployTrigger: commit
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: PYTHON_VERSION
        value: 3.12.8
